name: VibeMap
options:
  bundleIdPrefix: com.brianhakel
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  VibeMap:
    type: application
    platform: iOS
    sources:
      - VibeMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianhakel.vibemap
        DEVELOPMENT_TEAM: 9S372WGPR4
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: VibeMap/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: 0.1.5
        CURRENT_PROJECT_VERSION: 61
        TARGETED_DEVICE_FAMILY: "1,2"
        VIBE_MAP_BACKEND_BASE_URL: "https://api.vibesyall.com"
  VibeMapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VibeMapTests
    dependencies:
      - target: VibeMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianhakel.vibemap.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VibeMap.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VibeMap"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  VibeMap:
    build:
      targets:
        VibeMap: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VibeMapTests
  VibeMap Demo:
    build:
      targets:
        VibeMap: all
    run:
      config: Debug
      commandLineArguments:
        "--demo": true
